      - Extract values EXACTLY as reported, including scientific notation. If a value is reported as e.g. 8.9 x 10^-11, output it as 8.9e-11. Do NOT round or drop exponents.
      - Each property value must include its numeric value, unit, and any conditions.
      - If multiple values are given under different test conditions for the same property type, record each as a separate property (e.g., "property_name_1", "property_name_2").
      - CONDITIONS are test parameters that vary the measurement itself. Examples include frequency range, temperature, strain rate, applied pressure, post-treatment state. Do NOT put sample IDs, sample labels, or sample thickness in conditions — those are already captured in dedicated top-level fields.
      - For frequency ranges, record both upper and lower bounds as separate conditions.
      - Use "not specified" for missing subfields. Do NOT guess.

      OUTPUT RULES:
      - Include ONLY samples that have at least one property in the allowed list above. Remove any sample from INPUT A that has no reportable properties.
