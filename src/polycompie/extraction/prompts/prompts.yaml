        - If multiple matrices and/or fillers are present, use the total-sum rule ONLY if ALL matrix/filler amounts are explicitly given AND share the same basis (all wt% or all vol%) AND the paper implies the basis totals to 100%.
        - If the paper does not explicitly state the basis or total, or if there are other components with unknown amounts, do not compute the other composition. Use "not specified".
      - If no filler is present, set filler name to "none" and amount to 0.0 and type to "not specified".
      - If a ratio is given (e.g., "3:1") along with a total loading (e.g., "25 wt%"), compute the individual amounts (e.g., 18.75 wt% and 6.25 wt%). Only do this when both the ratio AND total are explicitly stated in the article.

      SURFACE TREATMENT RULES:
      - Use "treated", "untreated", or "not specified" depending on available details. Put details in "description".

      SAMPLE THICKNESS RULES:
      - Report the sample thickness value and unit if provided, or "not specified".
